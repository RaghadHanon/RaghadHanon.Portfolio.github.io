name: Publish portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import and verify portfolio media on first run
        run: python scripts/import_assets.py
      - name: Store imported media in the repository
        run: |
          git add dist/assets .assets-materialized
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Store portfolio media and documents'
            git push origin HEAD:main
          fi
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Build static pages
        run: python scripts/build_pages.py
        env:
          PORTFOLIO_URL: ${{ steps.pages.outputs.base_url }}
      - name: Verify pages and assets
        run: python scripts/validate_site.py
      - name: Verify JavaScript syntax
        run: |
          node --check dist/app.js
          node --check dist/collabrium-engineering.js
          node --check dist/project-archive.js
          node --check dist/presentation-download.js
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
